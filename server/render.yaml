services:
  - type: web
    name: github-pr-manager-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: GITHUB_CLIENT_ID
        fromService:
          name: github-pr-manager-backend
          type: web
          envVarKey: GITHUB_CLIENT_ID
      - key: GITHUB_CLIENT_SECRET
        fromService:
          name: github-pr-manager-backend
          type: web
          envVarKey: GITHUB_CLIENT_SECRET
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: github-pr-manager-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
